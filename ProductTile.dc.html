<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onclick="{{ p.onOpen }}" style="cursor:pointer">
  <div style="position:relative;width:100%;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:#F5F5F6">
    <image-slot id="{{ p.imgId }}" placeholder="{{ p.name }}" shape="rounded"></image-slot>
    <div style="position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:12px;background:rgba(255,255,255,0.85);display:flex;align-items:center;justify-content:center;font-size:15px;color:#282C3F">♡</div>
  </div>
  <div style="font-size:12px;font-weight:700;letter-spacing:0.3px;color:#282C3F;margin-top:8px">{{ p.brand }}</div>
  <div style="font-size:11px;color:#7E818C;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ p.name }}</div>
  <div style="display:flex;align-items:center;gap:4px;margin-top:2px">
    <span style="font-size:11px;font-weight:700;color:#282C3F">★ {{ p.rating }}</span>
    <span style="font-size:11px;color:#7E818C">({{ p.reviews }})</span>
  </div>
  <div style="display:flex;align-items:baseline;gap:6px;margin-top:4px;flex-wrap:wrap">
    <span style="font-size:12px;font-weight:700;color:#282C3F">{{ p.priceStr }}</span>
    <span style="font-size:11px;color:#7E818C;text-decoration:line-through">{{ p.mrpStr }}</span>
    <span style="font-size:11px;font-weight:700;color:#FF3F6C">{{ p.discount }}</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}"></script>
</body>
</html>
